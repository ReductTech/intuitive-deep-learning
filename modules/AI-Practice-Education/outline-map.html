<script id="outline-data" type="application/json">{"id":"ai-practice-education","title":"大模型驱动的实践能力培养体系与平台","description":"41页大纲：保留前28页设计，补充 ResNet 到 Res2Net、完整学习闭环与平台推广规模；后部页面按新版讲稿组织。","path":"/modules/ai-practice-education","entry":"AIPracticeEducationGuide.tsx","ppt":{"entry":"AIPracticeEducationPpt.tsx","path":"/scenedeck/","player":false},"pages":[{"title":"大模型驱动的实践能力培养体系与平台","snippet":"各位老师、各位同仁，大家好。今天分享的是大模型驱动的实践能力培养体系与平台。我们希望借助多模态大模型，降低科研信息整理、学习内容制作和实践准备的成本，让学习者把更多时间投入到知识理解、动手实践与创新探索中。接下来，我会从 AI 时代需要什么样的学习能力谈起，再结合平台的实际案例，介绍我们如何把这些理念落实到教学实践中。"},{"title":"AI 时代，学习的重点或从积累知识转向理解与应用","snippet":"AI 已经能够帮助我们查找资料、解释概念和编写代码，获取知识的方式正在发生变化。但获取答案并不等于真正掌握知识。我们仍然需要判断信息是否可靠，理解方法为什么有效、适用于什么条件，并通过实践检验自己的认识。面对持续增长的知识，除了掌握必要的基础，我们还需要具备更强的理解、应用和持续更新知识的能力。"},{"title":"系统掌握知识，持续追踪前沿","snippet":"成为知识探索者，需要两方面能力。一方面，要系统掌握知识，理解基本概念、关键方法以及它们之间的联系，建立能够支撑实践的知识体系。另一方面，要持续追踪专业前沿，了解新的问题、新的方法和新的研究成果，不断更新已有认识。基础知识帮助我们理解前沿，前沿研究也会促使我们重新认识基础。围绕这两方面需求，我们正在建设一套连接科研与教育的平台。"},{"title":"面向知识探索者的科研与教育平台","snippet":"平台围绕知识获取、理解、实践和反馈，形成四项相互衔接的能力。首先，通过论文分析与个性化推荐，帮助学习者找到值得关注的研究；其次，借助多模态大模型，将专业知识转化为可交互、可渐进的学习内容；再次，通过编程环境与可视化实验，帮助学习者把理解落实为实际操作；最后，通过学习者建模与评价，为后续的内容推荐、任务安排和教师指导提供参考。下面先从科研信息供给开始。"},{"title":"每日新发论文数量远超人类阅读上限","snippet":"先看科研信息供给。以人工智能领域为例，论文数量持续增长，已经远远超出个人能够逐篇阅读和深入理解的范围。斯坦福大学 2025 年 AI Index 报告统计，全球计算机领域英文 AI 论文在 2023 年达到 24.274 万篇，折合全年日均约 665 篇。这里的日均数是按全年总量计算的平均值，并不代表每天实际发表数量都相同。即使只关注一个研究方向，学习者也很难读完所有相关工作，更不用说进一步分析方法、实验和创新点。因此，我们需要的不只是更多信息，而是更有效的信息筛选方式。"},{"title":"高质量个性化科研信息供给","snippet":"针对这一问题，平台每天自动分析数百篇文章，从论文的问题、方法和贡献等方面提取信息，并结合学习者的兴趣与研究目标进行个性化推荐。这样，学习者可以把有限的时间投入更相关、更值得深入阅读的工作，而不是被不断增长的信息淹没。当然，推荐不能代替阅读和判断，它的作用是帮助学习者更快找到值得研究的方向。对于刚发表、尚未积累引用和长期反馈的论文，我们还需要探索更早期的评价依据。"},{"title":"自研论文影响力预测与质量估计算法","snippet":"围绕论文的早期判断，我们开展了两项相关研究。NAIPv1 从论文题目和摘要出发，预测其潜在学术影响力；NAIPv2 进一步利用同行评审数据研究论文质量估计。两项工作分别提供影响力预测与质量估计信号，帮助我们从论文内容和已有评审信息中获取参考。NAIPv2 在训练阶段学习论文之间的相对质量关系，以减轻领域、年份和评分尺度差异带来的影响，推理时仍然可以对单篇论文进行评分。这些研究为科研信息处理提供了技术基础，但具体推荐仍需结合学习者的兴趣与研究目标。"},{"title":"论文评价服务：从研究方法到在线应用","snippet":"这些研究也进入了在线论文评价服务。我们可以输入论文题目和摘要，查看相应的参考评分。这里展示的是服务操作过程，示例中的固定分数用于演示交互，并不代表原服务对这些论文的实际预测结果。右侧展示的 14857 次是项目方提供的 ZeroGPU 累计运行统计，不是网站访问量或用户人数。希望进一步体验的老师，可以扫描页面上的二维码访问真实服务。我们希望通过这些研究与应用，让科研信息处理不只停留在算法层面，而是成为学习者日常科研活动的一部分。"},{"title":"让初学者走进专业知识","snippet":"对于刚进入大学、开始学习专业课程的学生，或者刚刚接触一个新领域的学习者，专业知识往往并不容易理解。他们需要知道一个概念究竟在描述什么，也需要理解不同概念之间有什么联系，最后才能逐步建立系统认识。我们希望借助更直观的表达和可操作的学习过程，帮助学生从熟悉的现象进入专业知识，而不是只记住一些孤立的术语。"},{"title":"面对陌生知识，如何兼顾入门与深入","snippet":"面对陌生知识，科普式讲解能够降低理解门槛，专业式讲解则帮助学习者建立严谨的概念体系和数学认识。两种方式各有作用，但如果只看现象，可能无法解释背后的计算过程；如果一开始就呈现大量公式，初学者又很难建立直觉。我们希望把两者连接起来，让学生先观察现象，再理解方法，最后能够解释具体计算是怎样产生的。下面以边缘检测为例。"},{"title":"科普式教育：用直观现象建立初步认识","snippet":"我们先观察同一幅图像经过不同方向的卷积核处理后，会出现怎样的边缘响应。学习者可以直接比较输入和输出，观察不同设置带来的变化，不必一开始就理解所有公式。这种方式能够帮助学生建立初步认识，但它主要回答的是结果有什么不同，还没有解释每一个输出值是如何计算出来的。"},{"title":"专业式教育：用概念与公式系统讲解","snippet":"进一步理解边缘检测，需要引入灰度梯度、Sobel 算子以及局部计算等概念。通过公式，我们能够明确计算规则和方法依据，也能够讨论不同算子为什么会产生不同响应。不过，对初学者而言，符号和公式仍然比较抽象。接下来，我们把这些表达与实际操作连接起来，让学生看清公式中的每一项对应图像中的什么。"},{"title":"直觉式学习：连接直观体验与专业理解","snippet":"现在，左边是输入图像，中间是卷积核，右边是输出图像。我们从一个局部窗口开始，观察像素值与权重如何相乘、求和，再把结果写入输出图像中的对应位置。随着窗口移动，学习者可以看到局部计算如何逐步组成完整的边缘图。这样，原本抽象的公式就有了具体对应，直观体验也能够进一步发展为对专业方法的理解。"},{"title":"曹冲称象","snippet":"我们再看一个熟悉的例子，曹冲称象。故事中的核心问题是怎样利用可以测量的东西，间接估计无法直接称量的对象。在这个教学改编中，我们让学生观察大象上船后的水位变化，再通过投石形成一组观测数据。石头不足的设定，是为了让学生思考：能否利用已有记录建立一个模型，进而估计大象的重量？这样，学生就可以从熟悉的故事自然进入回归问题。"},{"title":"调整直线，估计象重","snippet":"有了观测数据之后，学生可以直接拖动拟合直线，观察预测结果以及平均绝对误差和均方误差的变化。每一次调整都能得到即时反馈，损失函数不再只是课本中的公式，而是可以观察和比较的量。学生还可以提交自己的估计，与本次模拟中的真实象重对照。这里也可以进一步讨论：已有数据上的拟合更好，并不意味着超出观测范围后的预测一定更准确。"},{"title":"从五子棋开始认识卷积核","snippet":"熟悉的游戏也可以成为理解专业方法的入口。这里，学生可以与计算机进行五子棋对弈，并通过示例棋局观察棋盘上的局部形状。完成对局后，我们保留棋局，作为后续分析的输入。这样，学生首先接触的是熟悉的棋形，随后才逐步理解计算机怎样表示棋盘、识别局部模式，以及如何利用这些局部信息进行计算。"},{"title":"棋形的局部匹配","snippet":"现在，我们把棋盘转换为数字表示，赢方、对手与空位分别记为正一、负一和零。学生可以拖动一个五乘五的窗口，逐项观察当前位置与目标模板的匹配情况。右侧则展开对应位置相乘再求和的计算过程，窗口移动时，输入数字和局部响应也会同步变化。通过这个过程，学生能够把熟悉的棋形与卷积核、局部计算等专业概念联系起来。"},{"title":"从想法到交互课件，还隔着一道技术门槛","snippet":"理解专业知识，并不意味着能够直接把它变成高质量的交互课件。创作者还需要处理页面设计、前端开发、交互逻辑和工程调试等问题。懂 AI 的人未必熟悉前端开发，擅长前端的人也未必理解专业知识，两类能力叠加形成了较高的制作门槛。我们希望通过 Creator Skill，把常见的设计要求、实现方式和工程基础组织起来，让创作者能够把更多精力放在知识理解和教学设计上。"},{"title":"Creator Skill：让创作者更专注于内容编排","snippet":"Creator Skill 主要从两个方面提供支持。一方面是创作指导，通过描述性的规则和偏好，帮助智能体组织知识主线、设计交互并安排视觉表达；另一方面是实现支持，通过可复用组件、统一视觉基础、页面模板和工具，为实际制作提供工程支撑。前者帮助智能体判断怎样设计更合适，后者帮助它把设计落实为页面。两者结合，能够降低制作门槛，但最终作品仍然需要检查专业准确性、交互效果和教学目标是否一致。"},{"title":"创作指导：五类技能协同参与课件设计","snippet":"平台将创作过程中的常见需求组织为设计、路由、评估、自进化和格式五类技能。设计技能关注知识组织与交互方案，路由技能根据任务选择适用的方法，评估技能发现问题并提出改进，自进化机制帮助沉淀反馈与偏好，格式技能则支撑页面结构和视觉一致性。它们不是要求创作者逐项配置的复杂流程，而是协同工作的基础能力。这里的交互用于说明不同技能的分工，相关模拟数字和概念流程不应被理解为实测结果。"},{"title":"实现支持：组件与工具支撑课件制作","snippet":"有了设计方案之后，还需要具体的组件和工具来完成页面。我们可以把标题、配色、控件和页面结构等通用能力，与课程专属的棋盘、背景和对弈逻辑组合起来，形成一个可独立运行的五子棋课件。这个过程不是简单地把所有元素拼在一起，而是让通用基础与具体教学内容协同工作。通过演示组装前后的变化，我们希望说明平台怎样减少重复开发，让创作者把精力集中在真正需要专业设计的部分。"},{"title":"一种全新的课件形态","snippet":"同一份交互课件，可以服务于课堂展示、自主学习和智能讲解等不同场景。课堂展示侧重教师组织讲解，自主学习保留真实交互和学习进度，智能讲解则可以结合讲稿和页面区域进行语音说明。不同形态共享同一套课程内容，但服务于不同的学习方式。这里展示的是同一份课件在不同场景下的使用方式，而不是把原本的课程逻辑简单复制到多个界面。"},{"title":"制作直觉式课件，人的作用是什么？","snippet":"人的作用首先是从专业知识中提炼关键问题，然后把问题转化为可观察、可比较的演示设计，最后检查画面和解释能否支撑结论。以卷积中的权重共享为例，我们固定输入大小、窗口大小和步长，让两个窗口同步扫描。左边每到新位置就更换一套权重，右边则在不同位置复用同一套权重。通过明确的视觉对比，学生可以直接看到两种方式的区别。AI 可以帮助实现页面，但关键问题的选择、比较条件的控制和专业表达的校准，仍然需要人的理解与判断。"},{"title":"把专业理解，变成具体的讲解设计","snippet":"这一页展示从一句需求到完整课件的过程。开始时，我们只提出制作一页权重共享演示的需求，AI 生成的图示逐步呈现，随后再加入具体的教学设计要求：两个窗口同步移动，左边在新位置更换颜色，右边始终使用相同颜色表示复用权重。最后形成能够解释权重共享的课件。这里真正要说明的，不是图示数量越多越好，而是当人能够明确问题、比较方式和表达意图时，AI 生成的内容才更容易服务于理解。"},{"title":"从想法到成品：课件创作流程","snippet":"我们再看一个完整的创作流程。从提出需求开始，智能体先整理大纲，再给出设计预览；创作者提出修改意见后，系统继续制作并检查结果。这里的界面采用预设脚本和已有素材演示流程，不代表每一步都在现场调用生成服务。这个例子主要说明，AI 可以协助组织任务、生成内容并响应修改，但课程副本、交互逻辑和最终结果仍然需要检查。创作效率的提升，最终应当服务于更好的内容组织与教学设计。"},{"title":"交互是可选项，理解才是目的","snippet":"交互并不是越多越好。以三乘三卷积核为例，单输入通道、单输出滤波器的卷积核包含九个可学习权重，不计偏置。左侧通过逐格点击展示权重，右侧直接呈现全部权重和维度关系。比较之后可以发现，逐格点击并没有增加对权重作用的解释，因此没有必要保留。对于需要观察计算过程、比较卷积核变化或预测输出的教学目标，有目的的交互才更有价值。设计的标准始终是能否帮助学习者理解，而不是控件数量。"},{"title":"渐进式披露，克制才是高级","snippet":"同一个边缘检测任务，可以包含输入图像、卷积核、步长、填充方式和输出结果等多个要素。如果一开始全部展开，学习者很容易被大量设置分散注意力。因此，我们可以先呈现当前最需要理解的卷积核，再根据学习需要逐步开放其他设置。左右两侧采用相同的固定权重计算，通过独立操作比较不同设置带来的结果。这里的重点不是隐藏功能，而是安排信息出现的时机，让学习者先回答当前问题，再逐步建立完整认识。"},{"title":"让学习者参与发现，而不只是接收答案","snippet":"残差学习提供了一个很好的例子。研究者观察到，一些更深的普通网络出现了训练误差反而升高的现象，这反映了优化上的困难。理论上，新增层可以学习恒等映射，从而保留原有网络的功能，但能够表示这样的解，并不意味着优化过程一定容易找到它。残差学习通过让新增分支拟合相对于输入的改动，并与恒等捷径相加，重新组织了学习问题。我们可以引导学生逐步观察这个矛盾，再从不同角度理解为什么要引入残差结构。需要强调的是，残差连接并不意味着任何网络都必然获得更好的效果。通过参与发现，学生能够从记住一个结构，进一步走向理解研究动机与方法选择。"},{"title":"从 ResNet 到 Res2Net：换一个角度提出新问题","snippet":"前面通过参与式探索理解了 ResNet：残差连接使深层网络更容易训练。接下来可以换一个观察角度：除了增加网络深度，能否在一个残差块内部更细致地表示不同尺度的信息？Res2Net 通过对特征通道分组，并在组间建立层次连接，在单个模块内部构建细粒度的多尺度表示。这里引用已有研究，并不是要求每位学生立即提出同样的方法，而是展示如何从理解一个经典方法出发，改变观察角度，提出可以继续研究的问题。"},{"title":"让代码真正运行起来：从理解到实现","snippet":"理解一个方法之后，学习者还需要把它写成能够运行的程序。我们以卷积神经网络为例，在网页中展示实际代码，学生可以查看模型结构、输入数据和输出结果，并运行基础示例。接下来，可以修改参数或补全关键代码，再次执行程序，观察结果是否符合预期。智能体可以辅助解释代码和处理环境问题，但学习者仍然需要理解关键操作，知道输入、参数与输出之间有什么联系。这里展示的是从看懂方法到动手实现的过程，而不是只观看预先制作好的动画。"},{"title":"通过实验比较，解释参数变化的影响","snippet":"程序能够运行之后，下一步是学会设计实验。我们先建立一个基线，再只改变一个因素，例如卷积步长，观察输出尺寸和计算结果怎样变化。随后比较修改前后的结果，分析差异来自哪里，并检查自己的解释是否符合实际运行情况。对于更复杂的任务，还可以记录实验配置和结果，逐步形成可复查的实验过程。通过这种方式，学生不仅要让程序运行，还需要解释为什么这样运行、结果说明了什么，以及当前实验还不能说明什么。"},{"title":"把文献、理解、实现与研究思考连成学习闭环","snippet":"现在把前面的环节连起来：围绕个人兴趣或研究任务获取论文，理解概念和方法，再把理解组织成可交互的学习内容；随后编写和运行代码，通过实验比较检验解释，最后提出新的问题并回到文献中寻找依据。学习评价贯穿这些过程，为后续资料推荐、练习安排与教师指导提供反馈。我们希望这些活动能够在同一应用中衔接，让学生保留每一步的作品、代码、实验记录与研究思考，而不是完成彼此割裂的作业。"},{"title":"从知识理解、工程实现到创新思考的多维评价","snippet":"学生完成实践任务后，教师需要了解的不只是最终作品是否完成，还包括学生在过程中表现出的不同能力。例如，他是否能够梳理一个方向的已有工作，是否真正理解关键方法，是否能够完成代码实现与实验比较，以及是否提出了有价值的后续问题。平台可以结合论文梳理、交互式内容、代码实践和实验结果等不同任务，辅助整理学生的学习表现。需要注意的是，单个作品的完成质量不能直接等同于完整的科研能力，评价应当结合任务过程、结果和教师判断。"},{"title":"学生能力看板：让学习表现支持教师指导与人才发现","snippet":"在实际教学中，教师往往需要同时指导大量学生，很难仅凭课堂表现全面了解每个人的特点。我们希望通过学生工作台，将学生所属课程、研究方向、实践任务和相关评价集中呈现。教师可以进一步查看学生在知识理解、工程实现和创新思考等方面的具体表现，了解哪些学生已经具备进一步探索的基础，哪些学生还需要补充指导。这样，评价就不仅用于记录成绩，还能够帮助教师安排后续任务、提供个性化指导，并在持续实践中发现有潜力的学生。这里展示的能力维度和评价结果，需要以实际任务记录及经过验证的评价方式为依据。 看板应呈现学生所属学校、课程和研究方向，并连接知识理解、代码复现、实验分析与创新思考等任务证据。教师点击某项表现时应能看到相应作品或记录，以支持针对性指导；课件表达质量只是评价的一个维度。"},{"title":"知识结构可视化：连接当前任务与整门课程","snippet":"学习者不仅需要知道一个概念是什么，还需要理解它依赖哪些基础，以及它在整门课程中处于什么位置。以深度学习为例，我们可以把张量、卷积、训练方法和网络结构改进等关键概念组织成一张知识关系图，展示它们之间的依赖与联系。对于某次具体任务，也可以进一步展开局部知识结构，例如从棋盘编码到局部模式，再到滑动窗口和权重共享。这样，学生能够更清楚地看到当前学习内容与已有知识之间的联系，教师也能够据此判断学生需要补充哪些基础。"},{"title":"教师如何组织一门实践课程","snippet":"在课程组织上，我们希望把基础讲解、交互学习和实践任务连接起来。教师先帮助学生建立必要的知识基础，再通过典型案例引导学生观察、理解和操作，最后安排相应的实践任务。以深度学习课程为例，可以在正常教学中穿插 AI 实践活动，让学生围绕自己选择的研究方向梳理已有论文、制作便于理解的交互式学习内容，并完成代码实现和实验分析。教师不需要把每一项工作都变成额外的独立课程，而是可以把实践融入原有教学节奏，并根据学生基础和课程目标调整任务要求。 课程可以采用16次课、每次90分钟的组织示例，将正常授课、教师演示与交互、学生实践和优秀作品展示结合起来。围绕同一研究方向，学生至少选择三篇相关论文，完成文献梳理、交互式讲解和后续问题总结；另完成一次代码复现，可优先选择缺少国产框架实现的工作，在国产平台上实现，并与 PyTorch 版本开展小规模实验对比。教师可结合自己的研究项目调整任务与难度。"},{"title":"在教学实践中发现人才，带领学生开展科研","snippet":"实践任务为教师了解学生提供了比单次考试更丰富的观察机会。学生在梳理文献、解释方法、实现代码和分析实验的过程中，会逐渐表现出不同的兴趣与能力。教师可以结合这些表现和日常教学情况，发现适合进一步培养的学生，并为他们提供参与科研项目的机会。对于已经具备一定基础的学生，还可以在教师指导下深入研究问题、完善实验并形成论文或其他科研成果。教学在这里不仅帮助学生掌握知识，也为人才发现和科研团队建设提供了入口。具体成果应当通过真实论文、学生贡献和指导案例来展示。"},{"title":"连接教师、学生、研究者与产业需求","snippet":"这套平台希望连接的不只是课堂中的教师和学生，还包括科研工作者、内容贡献者与产业需求。教师能够通过实践了解学生的特点，并进一步指导有潜力的学生开展研究；学生在实践和指导中成长，获得展示能力和参与科研的机会；科研工作者可以把最新成果转化为更容易理解的学习内容，扩大研究工作的传播范围；产业和招生单位则有机会结合学生的实际实践表现，寻找与自身需求相匹配的人才。不同参与者能够从中获得不同价值，平台也因此有机会形成持续发展的科研教育生态。"},{"title":"让学习内容在使用与反馈中持续进化","snippet":"学习资料并不一定在制作完成时就达到最佳状态。学生在学习中遇到的困难、教师在讲解中发现的问题，以及研究者带来的新成果，都可以成为改进内容的来源。教师可以根据学生的理解情况修订解释，学生可以补充案例、澄清概念或优化交互，科研工作者可以把新的研究成果带入课程。经过检查和修订后，这些内容再进入后续教学，形成使用、反馈、修订和再使用的循环。社区的价值就在于让每次学习和教学都可能推动内容进一步完善，使学习资料逐步积累为可复用、可持续更新的知识资产。"},{"title":"平台使用规模与高校开课：从课堂走向更多高校","snippet":"推广平台，需要同时说明使用范围和实际教学落地。这里将按统一统计截止日期，展示实际学习或使用平台的学生规模，以及已经在平台开课的教师、高校和课程情况；其中，985 高校的教师人数与学校数量分别统计。具体数字需要依据平台后台核实后再对外展示，不能将讨论中的示例数字当作实际数据。前面论文服务的 14,857 次 ZeroGPU 运行属于另一项服务的运行统计，也不能换算成学生人数或课程数量。"},{"title":"从一门成熟课程开始，共同建设 AI 时代的实践教育","snippet":"我们希望先从一门成熟的深度学习课程开始，让教师能够在已有课程基础上开展教学，并逐步把 AI 实践融入其中。以一个学期为例，学生可以围绕一个研究方向完成至少三篇相关论文的梳理与交互式呈现，再完成一次代码复现和小规模实验比较。教师可以根据课程目标调整具体要求，并在教学中选择优秀作品进行交流和展示。平台提供必要的内容、工具与实践支持，教师负责组织教学、指导学生并判断学习成效。我们也希望与更多高校合作，在真实课程中检验和完善这套培养方式，让学生逐步形成获取知识、理解方法、动手实践和持续创新的能力。"}],"badge":"实践能力培养","moduleType":"teaching","difficulty":"introductory","audience":"general","moduleIdentity":{"version":1,"id":"b8d86e85-2150-47e3-9e1a-aa7cc7cce15c"}}</script>
<script>
const data=JSON.parse(document.getElementById('outline-data').textContent);
const groups=[['总体理念与平台定位',1,4,'#325b8b'],['高质量科研信息供给',5,8,'#487fa9'],['专业知识理解与交互示例',9,17,'#3c8b91'],['创作支撑与教学设计',18,28,'#6f79a6'],['从理解走向实践与创新',29,32,'#b57b3b'],['学习评价与课程组织',33,36,'#5f8a73'],['人才培养与科研教育生态',37,39,'#8b6c91'],['平台规模与高校合作',40,41,'#5e7995']];
const notes={29:'使用真实研究示范研究视角的变化；不将已有成果描述为学生当场提出的方法。',30:'规划：网页内编辑、运行和重跑代码。避免仅展示代码图片。',32:'评价反馈贯穿学习过程。',34:'规划：点击某项表现能查看任务、作品、代码和实验依据。',36:'16次课×90分钟是组织示例，教师可按课程与研究任务调整。',37:'学生身份、论文、竞赛、年份及平台支持均待核实。',40:'后台数据、统计日期和口径待补充；不使用讨论中的示例数字。'};
const refs={29:[['Deep Residual Learning for Image Recognition · CVPR 2016','https://openaccess.thecvf.com/content_cvpr_2016/html/He_Deep_Residual_Learning_CVPR_2016_paper.html'],['Res2Net: A New Multi-scale Backbone Architecture · IEEE TPAMI 2021','https://arxiv.org/abs/1904.01169']]};
const branches=document.getElementById('branches');const entries=[];
groups.forEach(([title,start,end,color],gi)=>{const branch=document.createElement('details');branch.className='branch';branch.style.setProperty('--accent',color);branch.open=gi===0;const summary=document.createElement('summary');const text=document.createElement('span');text.textContent=String(gi+1).padStart(2,'0')+' '+title;const range=document.createElement('span');range.className='range';range.textContent=start+'—'+end+'页';summary.append(text,range);branch.append(summary);const nodes=document.createElement('div');nodes.className='nodes';for(let n=start;n<=end;n++){const p=data.pages[n-1],button=document.createElement('button');button.className='page';const number=document.createElement('span');number.className='num';number.textContent=String(n).padStart(2,'0');const label=document.createElement('span');label.textContent=p.title;button.append(number,label);button.addEventListener('click',()=>select(n,button));nodes.append(button);entries.push({branch,button,p});}branch.append(nodes);branches.append(branch);});
function select(n,button){document.querySelectorAll('.page.active').forEach(e=>{e.classList.remove('active');e.removeAttribute('aria-current');});button.classList.add('active');button.setAttribute('aria-current','true');document.getElementById('position').textContent='第 '+n+' / '+data.pages.length+' 页'+(n>28?' · 规划 / 待完善':' · 保留设计');document.getElementById('detail-title').textContent=data.pages[n-1].title;document.getElementById('speech').textContent=data.pages[n-1].snippet;const noteBox=document.getElementById('notes');noteBox.replaceChildren();if(notes[n]){const note=document.createElement('div');note.className='note';note.textContent=notes[n];noteBox.append(note);}const links=document.getElementById('refs');links.replaceChildren();(refs[n]||[]).forEach(([label,url])=>{const a=document.createElement('a');a.textContent=label+' ↗';a.href=url;a.target='_blank';a.rel='noreferrer';links.append(a);});}
document.getElementById('expand').onclick=()=>document.querySelectorAll('.branch').forEach(e=>e.open=true);
document.getElementById('collapse').onclick=()=>document.querySelectorAll('.branch').forEach(e=>e.open=false);
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();entries.forEach(({button,p})=>button.hidden=!!q&&!(p.title+' '+p.snippet).toLowerCase().includes(q));document.querySelectorAll('.branch').forEach(branch=>{branch.hidden=![...branch.querySelectorAll('.page')].some(b=>!b.hidden);if(q&&!branch.hidden)branch.open=true;});});
window.addEventListener('beforeprint',()=>document.querySelectorAll('.branch').forEach(e=>e.open=true));
select(1,entries[0].button);
</script></body></html>
