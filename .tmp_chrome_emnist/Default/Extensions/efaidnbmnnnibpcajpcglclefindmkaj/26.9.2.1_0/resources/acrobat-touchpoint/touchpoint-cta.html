<style>
    .acrobat-touch-point {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        height: 24px;
        padding: 0 8px;
        gap: 4px;
        border: 1px solid rgb(209, 209, 209);
        border-radius: 4px;
        background: #FFFFFF;
        font-family: "AdobeClean-Regular", sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: #201F1E;
        cursor: pointer;
        pointer-events: all;
        text-decoration: none;
        vertical-align: middle;
    }

    .acrobat-touch-point:hover,
    .acrobat-touch-point:active,
    .acrobat-touch-point:focus {
        background: #EEEEEE;
    }

    .acrobat-touch-point:focus-visible {
        outline: 1px solid #000000;
        outline-offset: -1px;
    }

    .acrobat-touch-point > .acrobat-icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        vertical-align: middle;
    }

    .acrobat-touch-point-text {
        display: flex;
        align-items: center;
        line-height: normal;
    }

    /* Hover/focus tooltip for this CTA (touchpoint-tooltip.js); it has no template of its own. */
    .acrobat-touch-point-tooltip {
        position: fixed;
        z-index: 2147483647;
        max-width: 240px;
        padding: 4px 8px;
        border-radius: 4px;
        background: #323232;
        color: #FFFFFF;
        font-family: "AdobeClean-Regular", sans-serif;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        pointer-events: none;
    }
</style>
<div class="acrobat-touch-point" role="button" tabindex="0">
    <div class="acrobat-touch-point-loader" hidden></div>
    <img class="acrobat-icon" alt="" />
    <span class="acrobat-touch-point-text"></span>
</div>
