# Independent demo-host deployment. Does not replace the existing port 443 site.
server {
    listen 5175 ssl;
    listen [::]:5175 ssl;
    server_name 39.105.207.234;
    ssl_certificate /etc/letsencrypt/live/shuku-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuku-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/shuku-idl/current;
    index index.html;
    client_max_body_size 101m;
    client_body_timeout 120s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/shuku/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control no-store always;
    }
    # The separate course-computation/Cloud stack is not configured on this host.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"课程计算服务暂未启用"}';
    }
    location = /__telemetry { return 204; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf|mp4|webm|wasm|glb|gltf)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
